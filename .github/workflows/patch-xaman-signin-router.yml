name: Patch Xaman SignIn Router

on:
  push:
    branches:
      - agent/role-navigation-hardening-20260728
    paths:
      - scripts/patch-xaman-signin-router.mjs
      - .github/workflows/patch-xaman-signin-router.yml

permissions:
  contents: write

jobs:
  patch-router:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/role-navigation-hardening-20260728
          fetch-depth: 0

      - name: Patch existing API router
        run: node scripts/patch-xaman-signin-router.mjs

      - name: Commit router patch
        run: |
          if git diff --quiet -- api/ott.ts; then
            echo "Router already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ott.ts
          git commit -m "Add signature-only Xaman SignIn actions"
          git push origin HEAD:agent/role-navigation-hardening-20260728
