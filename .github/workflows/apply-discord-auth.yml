name: Apply Discord authentication

on:
  push:
    branches:
      - agent/auth-discord-20260726
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Discord patch
        run: node scripts/apply-discord-auth-patch.mjs

      - name: Clean install
        run: npm ci

      - name: Run release quality gate
        run: npm run quality

      - name: Remove one-time patch files
        run: rm scripts/apply-discord-auth-patch.mjs .github/workflows/apply-discord-auth.yml .github/discord-auth-trigger.txt

      - name: Commit validated Discord support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Discord account login"
          git push origin HEAD:agent/auth-discord-20260726
