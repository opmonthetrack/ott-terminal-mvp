name: Apply public wallet testing release

on:
  pull_request:
    branches:
      - agent/full-release-hardening-20260724
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/xrpl-wallet-hub-20260724' || github.ref_name == 'agent/xrpl-wallet-hub-20260724'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet release branch
        uses: actions/checkout@v4
        with:
          ref: agent/xrpl-wallet-hub-20260724
          fetch-depth: 0

      - name: Reconstruct controlled release
        run: |
          cat \
            .release-payload/chunk00.b64 \
            .release-payload/chunk0102.b64 \
            .release-payload/chunk0304.b64 \
            .release-payload/chunk0506.b64 \
            .release-payload/chunk0708a.b64 \
            .release-payload/chunk0708b1.b64 \
            .release-payload/chunk0708b2.b64 \
            | tr -d '\r\n' > /tmp/ott-public-wallet-release.b64

          actual_size="$(wc -c < /tmp/ott-public-wallet-release.b64)"
          actual_hash="$(sha256sum /tmp/ott-public-wallet-release.b64 | cut -d' ' -f1)"
          {
            echo "expected_size=76860"
            echo "actual_size=${actual_size}"
            echo "expected_base64_sha256=ec861d4c28dc8c1d74608ba4ed0a61aeaea882471b66d791ff273b62ab1f4f0e"
            echo "actual_base64_sha256=${actual_hash}"
            echo "chunk00_size=$(tr -d '\r\n' < .release-payload/chunk00.b64 | wc -c)"
            echo "chunk0102_size=$(tr -d '\r\n' < .release-payload/chunk0102.b64 | wc -c)"
            echo "chunk0304_size=$(tr -d '\r\n' < .release-payload/chunk0304.b64 | wc -c)"
            echo "chunk0506_size=$(tr -d '\r\n' < .release-payload/chunk0506.b64 | wc -c)"
            echo "chunk0708a_size=$(tr -d '\r\n' < .release-payload/chunk0708a.b64 | wc -c)"
            echo "chunk0708b1_size=$(tr -d '\r\n' < .release-payload/chunk0708b1.b64 | wc -c)"
            echo "chunk0708b2_size=$(tr -d '\r\n' < .release-payload/chunk0708b2.b64 | wc -c)"
          } > .release-payload/diagnostics.txt

          if [ "${actual_size}" != "76860" ] || [ "${actual_hash}" != "ec861d4c28dc8c1d74608ba4ed0a61aeaea882471b66d791ff273b62ab1f4f0e" ]; then
            git config user.name "ott-quality-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .release-payload/diagnostics.txt
            git commit -m "Record public wallet release payload mismatch" || true
            git push origin HEAD:agent/xrpl-wallet-hub-20260724
            exit 1
          fi

          base64 --decode /tmp/ott-public-wallet-release.b64 > /tmp/ott-public-wallet-release.tar.gz
          echo "d2c5f980c41ac4f59780a8dc50ddd088b30f91e51544281f41f005a7c79033e6  /tmp/ott-public-wallet-release.tar.gz" | sha256sum --check
          tar -xzf /tmp/ott-public-wallet-release.tar.gz

      - name: Remove temporary release files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('.ott-release-delete.json', 'utf8'));
          const paths = Array.isArray(manifest) ? manifest : (manifest.delete ?? []);
          for (const path of paths) {
            fs.rmSync(path, { recursive: true, force: true });
          }
          NODE
          rm -rf .release-payload
          rm -f .ott-release-delete.json
          rm -f scripts/.wallet-release-staging-marker
          rm -f .github/workflows/export-wallet-release-source.yml
          rm -f .github/workflows/apply-public-wallet-release.yml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci --ignore-scripts

      - name: Validate routes TypeScript and production build
        run: npm run quality

      - name: Commit validated public test release
        run: |
          git config user.name "ott-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Launch public wallet verification and visual NFT collections"
          git push origin HEAD:agent/xrpl-wallet-hub-20260724
