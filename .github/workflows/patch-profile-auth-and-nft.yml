name: Patch Profile NFT and Auth

on:
  push:
    branches:
      - agent/role-navigation-hardening-20260728
    paths:
      - scripts/patch-profile-auth-and-nft.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/role-navigation-hardening-20260728
          fetch-depth: 0

      - name: Apply profile patch
        run: node scripts/patch-profile-auth-and-nft.mjs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabs/WalletTab.tsx src/lib/ottAuth.ts src/components/NftCollectionGallery.tsx
          git commit -m "Show all NFT routes and preserve login providers"
          git push origin HEAD:agent/role-navigation-hardening-20260728
